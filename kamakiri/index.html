<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カマキリの草むらぼうけん</title>
<style>
  html, body { margin: 0; height: 100%; background: #2e7d32; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #rotate {
    display: none; position: fixed; inset: 0; background: #1b5e20; color: #fff;
    font-family: sans-serif; font-size: 8vw; align-items: center; justify-content: center;
  }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>
<div id="rotate">よこにしてね</div>
<script>
// ===== 仮の数値（遊んでから調整する）=====
const SPEED = 3;          // 右へ進む速さ
const GRAVITY = 0.6;      // 重力
const JUMP_POWER = 13;    // ジャンプの強さ

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND_Y = 360;     // 地面の高さ

// カマキリ（仮の図形）
const player = { x: 100, y: GROUND_Y - 50, w: 50, h: 50, vy: 0, onGround: true };
let scrollX = 0;          // 画面のスクロール量
let frame = 0;            // 経過時間（足の動きに使う）

// ジャンプ（スペース or ↑）
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (player.onGround) {
      player.vy = -JUMP_POWER;
      player.onGround = false;
    }
  }
});

function update() {
  scrollX += SPEED;
  frame++;
  player.vy += GRAVITY;
  player.y += player.vy;
  if (player.y >= GROUND_Y - player.h) {
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.onGround = true;
  }
}

function draw() {
  // 空と背景
  ctx.fillStyle = '#bfe8ff';
  ctx.fillRect(0, 0, W, H);
  // 地面
  ctx.fillStyle = '#4caf50';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  // 草（スクロールして見える）
  ctx.fillStyle = '#2e7d32';
  const gap = 40;
  const offset = scrollX % gap;
  for (let x = -offset; x < W + gap; x += gap) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y);
    ctx.lineTo(x + 10, GROUND_Y - 25);
    ctx.lineTo(x + 20, GROUND_Y);
    ctx.fill();
  }
  drawMantis(player.x, player.y, frame, !player.onGround);
}

// 楕円を回転つきで塗る小さな道具
function ellipse(cx, cy, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2);
  ctx.fill();
}

// 線を引く小さな道具
function line(x1, y1, x2, y2, width, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

// カマキリ（右向き）。px, py は当たり判定の左上。t は動きの時間、air はジャンプ中
function drawMantis(px, py, t, air) {
  ctx.save();
  ctx.translate(px, py);
  const dark = '#558b2f';
  const swing = air ? 0 : Math.sin(t * 0.3) * 5;

  // 後ろ足（走るときは交互に動く／ジャンプ中は広げる）
  if (air) {
    line(16, 34, 4, 46, 3, dark);
    line(24, 36, 22, 50, 3, dark);
    line(32, 36, 42, 46, 3, dark);
  } else {
    line(16, 34, 10 + swing, 50, 3, dark);
    line(24, 36, 24 - swing, 50, 3, dark);
    line(32, 36, 34 + swing, 50, 3, dark);
  }

  // おなか（うしろの長い部分）と、はね
  ellipse(14, 28, 17, 9, -0.35, '#7cb342');
  ellipse(14, 24, 16, 6, -0.35, '#c5e1a5');

  // むね
  ellipse(30, 26, 8, 12, 0.3, '#7cb342');

  // かま（前足）：ふだんはたたむ／ジャンプ中は上にあげる
  if (air) {
    line(34, 24, 48, 14, 4, dark);
    line(48, 14, 54, 24, 3, dark);
  } else {
    line(34, 24, 46, 28, 4, dark);
    line(46, 28, 40, 37, 3, dark);
  }

  // 頭（三角形に近い、まるい顔）
  ellipse(38, 12, 10, 8, 0, '#8bc34a');
  ctx.fillStyle = '#8bc34a';
  ctx.beginPath();
  ctx.moveTo(30, 15);
  ctx.lineTo(46, 15);
  ctx.lineTo(38, 24);
  ctx.closePath();
  ctx.fill();

  // しょっかく
  line(35, 5, 29, -3, 2, dark);
  line(41, 5, 47, -3, 2, dark);

  // 大きな目
  for (const ex of [33.5, 42.5]) {
    ellipse(ex, 11, 4.5, 5.5, 0, '#ffffff');
    ellipse(ex + 1, 11.5, 2.6, 3.4, 0, '#222222');
    ellipse(ex + 1.8, 10, 1, 1, 0, '#ffffff');
  }

  // 口（にこっ）
  ctx.strokeStyle = dark;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(39, 17, 3, 0.2, Math.PI - 0.2);
  ctx.stroke();

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
