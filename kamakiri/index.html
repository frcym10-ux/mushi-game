<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カマキリの草むらぼうけん</title>
<style>
  /* 画面全体を、ゲームの描画に使う。ゲームの部分（16:9）は、真ん中に表示する */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe8ff; }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none;
  }
  #rotate {
    display: none; position: fixed; inset: 0; background: #1b5e20; color: #fff;
    font-family: sans-serif; font-size: 8vw; align-items: center; justify-content: center;
  }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">よこにしてね</div>
<script>
// ===== 仮の数値（遊んでから調整する）=====
const SPEED = 2.4;        // 右へ進む速さ（4歳の子が遊ぶので、ゆっくりめ）
const GRAVITY = 0.6;      // 重力
const JUMP_POWER = 13;    // ジャンプの強さ

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 450;   // ゲームの広さ（この大きさを、画面の真ん中に拡大・縮小して表示する）
const GROUND_Y = 360;     // 地面の高さ

// 画面の大きさに合わせて、描く場所と倍率を決める（スマホの向きやアドレス欄の変化にも対応）
let view = { s: 1, ox: 0, oy: 0 };
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
  const s = Math.min(canvas.width / W, canvas.height / H);
  view = { s, ox: (canvas.width - W * s) / 2, oy: (canvas.height - H * s) / 2 };
  ctx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', resize);
resize();

// カマキリ（仮の図形）
const PLAYER_X = 100;        // カマキリの、画面での基本の位置（はじかれたときだけ、少し後ろへずれる）
const MAX_HP = 3;            // ハートの数（敵に3回はじかれると、アウト）
const player = { x: PLAYER_X, y: GROUND_Y - 50, w: 50, h: 50, vy: 0, onGround: true, jumps: 0, knockX: 0, hp: MAX_HP, invUntil: -1 };
const PLAYER_HIT_PAD = 12;   // 敵との当たりでは、カマキリの左右を、この分だけ小さく見る（ゆるくする）
const MAX_JUMPS = 2;         // 空中でもう一度跳べる（2段ジャンプ）
let scrollX = 0;          // 画面のスクロール量
let frame = 0;            // 経過時間（足の動きに使う）
let caught = 0;           // つかまえた虫の数

// ===== 仮の効果音（ブラウザで鳴らす簡単な音。あとで差し替える）=====
let audioCtx = null;
function beep(freqFrom, freqTo, seconds, type, volume) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const t = audioCtx.currentTime;
    osc.type = type;
    osc.frequency.setValueAtTime(freqFrom, t);
    osc.frequency.linearRampToValueAtTime(freqTo, t + seconds);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + seconds);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + seconds);
  } catch (e) { /* 音が鳴らなくてもゲームは続ける */ }
}

// ===== 演出（虫をつかまえたときの「ぱくっ！」、2段ジャンプの「ぽん」）=====
// x は草むらの上の位置（地面と一緒に流れる）、y は画面の高さ、born は始まった時刻。
const effects = [];
const MUNCH_FRAMES = 42;               // 「ぱくっ！」が出ている時間
const PUFF_FRAMES = 16;                // 2段ジャンプの輪が出ている時間
const OUCH_FRAMES = 36;                // 「いたっ！」が出ている時間

// ===== ゴール（大きな木の根もと）=====
const GOAL_X = 16000;                  // 木の左はしの、草むらの上の位置（約90秒走ったところ・仮の数値）
const TREE_SIZE = 300;                 // 木の絵の大きさ
const TREE_FOOT = 0.875;               // 絵の高さのうち、根もと（地面）にあたる割合
const goalImg = new Image();
goalImg.src = 'assets/goal-tree.svg';

// ===== 虫（つかまえる）=====
// x は草むらの上の位置。画面に出る位置は x - scrollX。type は 'grasshopper'（バッタ）か 'cricket'（コオロギ）
const bugs = [];
for (let i = 0; 600 + i * 420 < GOAL_X - 700; i++) {      // ゴールの手前まで、420ピクセルおき
  bugs.push({ x: 600 + i * 420, type: i % 2 === 0 ? 'grasshopper' : 'cricket', phase: i * 23, caughtAt: -1 });
}
const bugImgs = {};
for (const name of ['grasshopper', 'cricket']) {
  bugImgs[name] = new Image();
  bugImgs[name].src = 'assets/' + name + '.svg';
}
const BUG_SIZE = 64;                  // 絵の大きさ
const BUG_HIT = { dx: 12, w: 40, h: 34 }; // 当たり判定（絵の左から dx、幅 w、地面からの高さ h）
const HOP_HEIGHT = 26;                // ぴょんと跳ねる高さ
const HOP_FRAMES = 100;               // 1回の跳ねの長さ（大きいほどゆっくり）
const POP_FRAMES = 14;                // つかまえたとき、消えるまでの長さ

// いまの跳ね具合（地面からどれだけ浮いているか）
function bugHop(bug) {
  const p = ((frame + bug.phase) % HOP_FRAMES) / HOP_FRAMES;
  if (p >= 0.5) return 0;               // 後半は地面で休む
  const q = p * 2;                      // 前半の 0〜1
  return HOP_HEIGHT * 4 * q * (1 - q);  // 山なりに跳ねる
}

// ===== スズメ（敵）=====
// その場で上下に跳ねるだけ。横から当たるとアウト、上から踏むとやっつける（しばらくして、また出てくる）
const sparrows = [];
for (let i = 0; 810 + i * 1260 < GOAL_X - 800; i++) {     // ゴールの手前まで、1260ピクセルおき
  sparrows.push({ x: 810 + i * 1260, phase: i * 17, defeatedAt: -1 });
}
const sparrowImg = new Image();
sparrowImg.src = 'assets/sparrow.svg';
const SPARROW_SIZE = 72;                             // 絵の大きさ
const SPARROW_HIT = { dx: 18, w: 34, h: 40 };        // 当たり判定（絵の左から dx、幅 w、高さ h）
const SPARROW_HOP = 24;                              // 跳ねる高さ（低めにして、飛び越えやすくする）
const SPARROW_HOP_FRAMES = 70;                       // 1回の跳ねの長さ
const SPARROW_RESPAWN_FRAMES = 300;                  // やっつけてから、また出てくるまで（約5秒・仮の数値）

// スズメの、いまの地面からの高さ
function sparrowHop(s) {
  const p = ((frame + s.phase) % SPARROW_HOP_FRAMES) / SPARROW_HOP_FRAMES;
  return SPARROW_HOP * 4 * p * (1 - p);
}

// ===== ネコ（敵）=====
// 決まった場所まで進むと、画面の右から左へ、地面を走ってくる。横から当たるとアウト、上から踏むとやっつける
// state: 'waiting'（まだ出てこない）/ 'running'（走っている）/ 'passed'（走り去った）/ 'defeated'（やっつけた）
const cats = [];
for (let i = 0; 1500 + i * 1500 < GOAL_X - 1500; i++) {   // ゴールの手前まで、1500ピクセルおき
  cats.push({ triggerScroll: 1500 + i * 1500, state: 'waiting', startFrame: 0, defeatedAt: -1, defeatX: 0 });
}
const catImg = new Image();
catImg.src = 'assets/cat.svg';                      // 絵は最初から左向き
const CAT_SIZE = 80;                                // 絵の大きさ
const CAT_HIT = { dx: 16, w: 44, h: 40 };           // 当たり判定（絵の左から dx、幅 w、高さ h）
const CAT_SPEED = 2;                                // ネコ自身の走る速さ（画面の速さは SPEED + これ）
const CAT_START_X = 1000;                           // 走り出す位置（画面の右の外）
const CAT_RESPAWN_FRAMES = 300;                     // やっつけてから、また走ってくるまで（約5秒・仮の数値）

// ネコの、いまの画面での左の位置
function catScreenX(c) {
  return CAT_START_X - (SPEED + CAT_SPEED) * (frame - c.startFrame);
}

// ネコの出番を進める
function updateCats() {
  for (const c of cats) {
    if (c.state === 'waiting' && scrollX >= c.triggerScroll) {
      c.state = 'running';
      c.startFrame = frame;
    } else if (c.state === 'running' && catScreenX(c) < -CAT_SIZE) {
      c.state = 'passed';
    } else if (c.state === 'defeated' && frame - c.defeatedAt >= CAT_RESPAWN_FRAMES) {
      c.state = 'running';          // また走ってくる
      c.startFrame = frame;
    }
  }
}

// ネコとの当たり。上から踏んだらやっつける。それ以外（横など）で重なったら、はじかれる
function checkCats(prevBottom) {
  const pLeft = player.x + PLAYER_HIT_PAD, pRight = player.x + player.w - PLAYER_HIT_PAD;
  const pTop = player.y, pBottom = player.y + player.h;
  for (const c of cats) {
    if (c.state !== 'running') continue;
    const sx = catScreenX(c);
    const cLeft = sx + CAT_HIT.dx, cRight = cLeft + CAT_HIT.w;
    const cTop = GROUND_Y - CAT_HIT.h;
    const overlap = pRight > cLeft && pLeft < cRight && pBottom > cTop && pTop < GROUND_Y;
    if (!overlap) continue;
    const fromAbove = player.vy > 0 && prevBottom <= cTop + 20;
    if (fromAbove || lightActive()) {      // 光の粉の効果中は、どこから触れてもやっつける
      c.state = 'defeated';
      c.defeatedAt = frame;
      c.defeatX = sx;
      beep(520, 900, 0.12, 'square', 0.07);    // やっつけた
    } else {
      hurt();
      if (gameState === 'out') return;
    }
  }
}

// ===== カラス（敵）=====
// 画面の上のほうを飛んでいて、ときどき急降下する。1羽だけ。
// 急降下の約1秒前に、地面に影が出て「カーッ」と鳴く（予告）。影は地面と一緒に流れてきて、カマキリの位置に着くころ、カラスが影の場所へ降りてくる。
// state: 'waiting'（まだ出てこない）/ 'cruising'（飛んでいる）/ 'warning'（予告）/ 'diving'（急降下）/ 'low'（地面にいる）/ 'rising'（上へ戻る）/ 'defeated'（やっつけた）
const crow = { state: 'waiting', since: 0, enterAt: 0, shadowWorld: 0, c0x: 0, c0y: 0, defeatedAt: -1, defeatWorld: 0, defeatY: 0 };
const crowImg = new Image();
crowImg.src = 'assets/crow.svg';                    // 絵は右向き（左へ向かうときは反転して描く）
const CROW_SIZE = 80;                               // 絵の大きさ
const CROW_HIT = { dx: 16, w: 44, h: 40 };          // 当たり判定（絵の左から dx、幅 w、高さ h）
const CROW_APPEAR_SCROLL = 1000;                    // ここまで進むと、最初のカラスが出てくる
const CROW_CRUISE_FRAMES = 240;                     // 飛んでいる時間（約4秒）
const CROW_WARN_FRAMES = 60;                        // 予告の時間（約1秒）
const CROW_DIVE_FRAMES = 34;                        // 急降下の時間
const CROW_LOW_FRAMES = 40;                         // 地面にいる時間
const CROW_RISE_FRAMES = 28;                        // 上へ戻る時間
const CROW_RESPAWN_FRAMES = 300;                    // やっつけてから、また出てくるまで（約5秒・仮の数値）
const CROW_FLY_Y = 95;                              // 飛んでいるときの足もとの高さ

// 飛んでいるときの位置（左右にゆっくり行き来する）。出てきた直後は、右の外から飛んでくる
function crowCruisePose() {
  const enter = 450 * Math.max(0, 1 - (frame - crow.enterAt) / 45);
  return {
    x: 420 + 150 * Math.sin(frame * 0.02) + enter,
    y: CROW_FLY_Y + 6 * Math.sin(frame * 0.1),
    faceLeft: enter > 0 || Math.cos(frame * 0.02) < 0
  };
}

// いまのカラスの位置（x は絵の中心、y は足もと）
function crowPose() {
  const f = frame - crow.since;
  const target = crow.shadowWorld - scrollX;        // 影の、いまの画面での位置
  switch (crow.state) {
    case 'diving': {
      const p = f / CROW_DIVE_FRAMES;
      return { x: crow.c0x + (target - crow.c0x) * p, y: crow.c0y + (GROUND_Y - crow.c0y) * p * p, faceLeft: target < crow.c0x };
    }
    case 'low':
      return { x: target, y: GROUND_Y, faceLeft: true };
    case 'rising': {
      const p = f / CROW_RISE_FRAMES;
      return { x: target, y: GROUND_Y - 330 * p * p, faceLeft: true };
    }
    default:
      return crowCruisePose();
  }
}

function startCrowCruise() {
  crow.state = 'cruising';
  crow.since = frame;
  crow.enterAt = frame;
}

// カラスの出番を進める
function updateCrow() {
  const f = frame - crow.since;
  switch (crow.state) {
    case 'waiting':
      if (scrollX >= CROW_APPEAR_SCROLL) startCrowCruise();
      break;
    case 'cruising':
      if (f >= CROW_CRUISE_FRAMES && scrollX < GOAL_X - 1500) {     // ゴールの近くでは、急降下しない
        crow.state = 'warning';
        crow.since = frame;
        // 影の場所：急降下が終わるころ、ちょうどカマキリの位置に着くところ
        crow.shadowWorld = scrollX + PLAYER_X + player.w / 2 + SPEED * (CROW_WARN_FRAMES + CROW_DIVE_FRAMES);
        beep(520, 380, 0.18, 'sawtooth', 0.07);                               // カー
        setTimeout(() => beep(480, 330, 0.22, 'sawtooth', 0.07), 200);        // ーッ
      }
      break;
    case 'warning':
      if (f >= CROW_WARN_FRAMES) {
        const pose = crowCruisePose();
        crow.c0x = pose.x;
        crow.c0y = pose.y;
        crow.state = 'diving';
        crow.since = frame;
      }
      break;
    case 'diving':
      if (f >= CROW_DIVE_FRAMES) { crow.state = 'low'; crow.since = frame; }
      break;
    case 'low':
      if (f >= CROW_LOW_FRAMES) { crow.state = 'rising'; crow.since = frame; }
      break;
    case 'rising':
      if (f >= CROW_RISE_FRAMES) startCrowCruise();
      break;
    case 'defeated':
      if (frame - crow.defeatedAt >= CROW_RESPAWN_FRAMES) startCrowCruise();   // また飛んでくる
      break;
  }
}

// カラスとの当たり（降りてくる間・地面・上へ戻る間だけ）。上から踏んだらやっつける。それ以外で重なったら、はじかれる
function checkCrow(prevBottom) {
  if (crow.state !== 'diving' && crow.state !== 'low' && crow.state !== 'rising') return;
  const pose = crowPose();
  const pLeft = player.x + PLAYER_HIT_PAD, pRight = player.x + player.w - PLAYER_HIT_PAD;
  const pTop = player.y, pBottom = player.y + player.h;
  const cLeft = pose.x - CROW_SIZE / 2 + CROW_HIT.dx, cRight = cLeft + CROW_HIT.w;
  const cBottom = pose.y, cTop = cBottom - CROW_HIT.h;
  const overlap = pRight > cLeft && pLeft < cRight && pBottom > cTop && pTop < cBottom;
  if (!overlap) return;
  const fromAbove = player.vy > 0 && prevBottom <= cTop + 20;
  if (fromAbove || lightActive()) {      // 光の粉の効果中は、どこから触れてもやっつける
    crow.state = 'defeated';
    crow.defeatedAt = frame;
    crow.defeatWorld = scrollX + pose.x;
    crow.defeatY = pose.y;
    beep(520, 900, 0.12, 'square', 0.07);    // やっつけた
  } else {
    hurt();
  }
}

// ===== ?ブロックとアイテム =====
// ブロックは空中に浮いている。ジャンプで下から頭をぶつけると、アイテムが出る（たたいたブロックは茶色になり、もう出ない）
// 光の粉：一定時間、敵に当たってもアウトにならず、触れた敵をやっつける
// はねのはっぱ：一定時間、ジャンプの高さが1.5倍
const BLOCK_SIZE = 48;                 // ブロックの大きさ
const BLOCK_BOTTOM = 100;              // ブロックの下の面の、地面からの高さ
const PLAYER_HEAD = 16;                // カマキリの絵は、当たり判定の枠より、頭の分だけ上に出ている
const ITEM_SIZE = 44;                  // アイテムの絵の大きさ
const EFFECT_FRAMES = 600;             // 効果の長さ（10秒）
const blockXs = [1400, 4300, 7200, 10100, 13000];                     // ブロックの位置（草むらの上の位置）
const blockItems = ['light', 'leaf', 'light', 'leaf', 'light'];       // 出てくるアイテムの順番
const blocks = blockXs.map((x, i) => ({ x, item: blockItems[i], used: false, hitAt: -1 }));
const items = [];                      // 出てきて、まだ取られていないアイテム
const blockImg = new Image();
blockImg.src = 'assets/block.svg';
const itemImgs = { light: new Image(), leaf: new Image() };
itemImgs.light.src = 'assets/item-light.svg';
itemImgs.leaf.src = 'assets/item-leaf.svg';
let lightUntil = -1;                   // 光の粉の効果が終わる時刻（frame）
let leafUntil = -1;                    // はねのはっぱの効果が終わる時刻（frame）
function lightActive() { return frame < lightUntil; }
function leafActive() { return frame < leafUntil; }

// たたいたあとの茶色いブロック（元の絵に、茶色を重ねて作る）
let usedBlockCanvas = null;
function getUsedBlockImage() {
  if (usedBlockCanvas) return usedBlockCanvas;
  if (!blockImg.complete || blockImg.naturalWidth === 0) return null;
  const c = document.createElement('canvas');
  c.width = 160; c.height = 160;
  const g = c.getContext('2d');
  g.drawImage(blockImg, 0, 0, 160, 160);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = 'rgba(121, 85, 72, 0.82)';
  g.fillRect(0, 0, 160, 160);
  usedBlockCanvas = c;
  return c;
}

// ジャンプで上がっているとき、頭がブロックの下の面を通りぬけようとしたら、たたいたことにする
function checkBlocks(prevHeadY) {
  const pLeft = player.x + 5, pRight = player.x + player.w - 5;
  const headY = player.y - PLAYER_HEAD;
  const blockBottomY = GROUND_Y - BLOCK_BOTTOM;
  for (const b of blocks) {
    if (b.used) continue;
    const left = b.x - scrollX, right = left + BLOCK_SIZE;
    if (player.vy < 0 && prevHeadY >= blockBottomY && headY < blockBottomY && pRight > left && pLeft < right) {
      b.used = true;
      b.hitAt = frame;
      player.y = blockBottomY + PLAYER_HEAD;   // 頭を打って、そこで止まる
      player.vy = 0;
      // アイテムは、ブロックから少し前へ飛び出して、地面に落ちる
      items.push({ type: b.item, x: b.x + BLOCK_SIZE / 2 - ITEM_SIZE / 2 + 50, y: GROUND_Y - BLOCK_BOTTOM - BLOCK_SIZE, vy: -6 });
      beep(260, 170, 0.1, 'square', 0.08);                                   // コン
      setTimeout(() => beep(600, 1000, 0.15, 'sine', 0.09), 90);             // ポン（アイテム出現）
    }
  }
}

// アイテムの動き（地面に落ちる）と、カマキリが取ったかどうか
function updateItems() {
  const pLeft = player.x - 3, pRight = player.x + player.w + 3;
  const pTop = player.y - PLAYER_HEAD, pBottom = player.y + player.h;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.vy += GRAVITY * 0.7;
    it.y += it.vy;
    if (it.y + ITEM_SIZE >= GROUND_Y) { it.y = GROUND_Y - ITEM_SIZE; it.vy = 0; }
    const sx = it.x - scrollX;
    if (sx < -ITEM_SIZE - 100) { items.splice(i, 1); continue; }          // 画面の左に流れていった
    const overlap = pRight > sx && pLeft < sx + ITEM_SIZE && pBottom > it.y && pTop < it.y + ITEM_SIZE;
    if (overlap) {
      if (it.type === 'light') lightUntil = frame + EFFECT_FRAMES;
      else leafUntil = frame + EFFECT_FRAMES;
      items.splice(i, 1);
      beep(700, 1500, 0.25, 'triangle', 0.1);                            // キラッ（取った）
    }
  }
}

// ===== ゲームの状態 =====
let gameState = 'playing';  // 'playing'（あそび中）か 'out'（アウトで止まっている）
let outFrames = 0;          // アウトになってからの経過
const RETRY_WAIT = 40;      // アウトの直後、「もういちど」を受け付けない時間（ジャンプの連打よけ）

let outScrollX = 0;         // アウトになったときの、草むらの上の位置（少し手前から再開するために覚えておく）
const INVINCIBLE_FRAMES = 90;     // はじかれたあと・再開したあと、しばらく当たらない時間（約1.5秒）
const KNOCK_X = 60;               // はじかれて、後ろへ下がる大きさ
const KNOCK_VY = 8;               // はじかれて、上へ跳ぶ強さ
const RESUME_BACK_FRAMES = 180;   // アウトのあと、何フレーム手前から再開するか（約3秒）

function goOut() {
  gameState = 'out';
  outFrames = 0;
  outScrollX = scrollX;
  beep(320, 110, 0.45, 'sawtooth', 0.07);   // ブー
}

// 敵に当たった。後ろへはじかれて、ハートが1つ減る。ハートがなくなったらアウト
function hurt() {
  if (frame < player.invUntil) return;          // はじかれた直後は、続けて当たらない
  player.hp--;
  effects.push({ type: 'ouch', x: scrollX + player.x + player.w / 2, y: player.y - 8, born: frame });   // 「いたっ！」
  if (player.hp <= 0) { goOut(); return; }
  player.invUntil = frame + INVINCIBLE_FRAMES;
  player.knockX = -KNOCK_X;                     // 後ろへ
  player.vy = -KNOCK_VY;                        // 少し上へ
  player.onGround = false;
  player.jumps = 1;                             // 空中で、あと1回は跳べる
  beep(300, 140, 0.2, 'sine', 0.12);            // ぼよん
}

// アウトのあと、約3秒手前から再開する（つかまえた虫の数は、そのまま）
function resumeFromEarlier() {
  const back = Math.max(0, outScrollX - RESUME_BACK_FRAMES * SPEED);
  scrollX = back;
  player.hp = MAX_HP;
  player.knockX = 0;
  player.x = PLAYER_X;
  player.y = GROUND_Y - player.h;
  player.vy = 0;
  player.onGround = true;
  player.jumps = 0;
  player.invUntil = frame + INVINCIBLE_FRAMES;   // 再開した直後も、少しのあいだ当たらない
  lightUntil = -1;                               // 光の粉・はねのはっぱの効果は、消える
  leafUntil = -1;
  items.length = 0;
  effects.length = 0;
  // 再開した場所から先は、敵と?ブロックを、もとの状態にもどす（つかまえた虫は、つかまえたまま）
  const here = back + PLAYER_X;
  for (const sp of sparrows) if (sp.x + SPARROW_SIZE > here) sp.defeatedAt = -1;
  for (const c of cats) c.state = c.triggerScroll >= back ? 'waiting' : 'passed';
  crow.state = 'waiting';
  crow.defeatedAt = -1;
  for (const b of blocks) if (b.x + BLOCK_SIZE > here) { b.used = false; b.hitAt = -1; }
  gameState = 'playing';
}

// 最初からやり直す
function restart() {
  scrollX = 0;
  frame = 0;
  caught = 0;
  player.y = GROUND_Y - player.h;
  player.vy = 0;
  player.onGround = true;
  player.jumps = 0;
  player.hp = MAX_HP;
  player.knockX = 0;
  player.x = PLAYER_X;
  player.invUntil = -1;
  outScrollX = 0;
  effects.length = 0;
  for (const b of bugs) b.caughtAt = -1;
  for (const s of sparrows) s.defeatedAt = -1;
  for (const c of cats) { c.state = 'waiting'; c.defeatedAt = -1; }
  crow.state = 'waiting';
  crow.defeatedAt = -1;
  for (const b of blocks) { b.used = false; b.hitAt = -1; }
  items.length = 0;
  lightUntil = -1;
  leafUntil = -1;
  gameState = 'playing';
}

// ジャンプ（地面にいるときだけ跳べる）。アウトで止まっているときは「もういちど」
function jump() {
  if (gameState === 'out') {              // アウトで止まっているとき：少し手前から再開
    if (outFrames > RETRY_WAIT) resumeFromEarlier();
    return;
  }
  if (gameState !== 'playing') {          // ゴールで止まっているとき：最初から
    if (outFrames > RETRY_WAIT) restart();
    return;
  }
  if (player.onGround || player.jumps < MAX_JUMPS) {
    // はねのはっぱ中は、高さが1.5倍。高さは、跳ぶ強さの2乗に比例するので、強さは√1.5倍にする
    player.vy = -(leafActive() ? JUMP_POWER * Math.sqrt(1.5) : JUMP_POWER);
    const second = !player.onGround;        // 空中でのジャンプ（2段目）
    player.jumps = second ? player.jumps + 1 : 1;
    player.onGround = false;
    if (second) {
      beep(560, 980, 0.12, 'square', 0.06);   // ぴょん（2段目は、少し高い音）
      effects.push({ type: 'puff', x: scrollX + player.x + player.w / 2, y: player.y + player.h, born: frame });
    } else {
      beep(380, 720, 0.12, 'square', 0.06);   // ぴょん
    }
  }
}

// キーボード：スペース or ↑
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (e.repeat) return;     // 押しっぱなしでは、くり返さない
    jump();
  }
});

// タッチ・マウス：画面をタップ（クリック）でジャンプ
window.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  jump();
});

function update() {
  if (gameState !== 'playing') { outFrames++; return; }   // アウト・ゴールのあいだは止まる
  scrollX += SPEED;
  frame++;
  player.knockX *= 0.92;                                       // はじかれて下がった分が、だんだんもどる
  if (Math.abs(player.knockX) < 0.5) player.knockX = 0;
  player.x = PLAYER_X + player.knockX;
  const prevBottom = player.y + player.h;   // 1つ前の足もとの高さ（上から踏んだか調べるため）
  const prevHeadY = player.y - PLAYER_HEAD; // 1つ前の頭の高さ（ブロックをたたいたか調べるため）
  player.vy += GRAVITY;
  player.y += player.vy;
  if (player.y >= GROUND_Y - player.h) {
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.onGround = true;
    player.jumps = 0;
  }
  checkBlocks(prevHeadY);
  updateItems();
  checkBugs();
  checkSparrows(prevBottom);
  if (gameState === 'out') return;   // スズメに当たってアウトになったら、ここで止める
  updateCats();
  checkCats(prevBottom);
  if (gameState === 'out') return;   // ネコに当たってアウトになったら、ここで止める
  updateCrow();
  checkCrow(prevBottom);
  if (gameState === 'out') return;   // カラスに当たってアウトになったら、ここで止める
  checkGoal();
}

// ゴール（大きな木の根もと）に着いたか。着いたら止まって、結果画面を出す
function checkGoal() {
  const center = scrollX + player.x + player.w / 2;     // カマキリの、草むらの上の位置
  if (center >= GOAL_X + TREE_SIZE / 2 - 20) {
    gameState = 'clear';
    outFrames = 0;
    // ファンファーレ（仮の音）
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, 0.2, 'triangle', 0.1), i * 150));
  }
}

// スズメとの当たり。上から踏んだらやっつける。それ以外（横など）で重なったら、はじかれる
function checkSparrows(prevBottom) {
  const pLeft = player.x + PLAYER_HIT_PAD, pRight = player.x + player.w - PLAYER_HIT_PAD;
  const pTop = player.y, pBottom = player.y + player.h;
  for (const s of sparrows) {
    if (s.defeatedAt >= 0) {
      if (frame - s.defeatedAt >= SPARROW_RESPAWN_FRAMES) s.defeatedAt = -1;   // また出てくる
      else continue;
    }
    const screenX = s.x - scrollX;
    const sLeft = screenX + SPARROW_HIT.dx, sRight = sLeft + SPARROW_HIT.w;
    const sBottom = GROUND_Y - sparrowHop(s);
    const sTop = sBottom - SPARROW_HIT.h;
    const overlap = pRight > sLeft && pLeft < sRight && pBottom > sTop && pTop < sBottom;
    if (!overlap) continue;
    const fromAbove = player.vy > 0 && prevBottom <= sTop + 20;
    if (fromAbove || lightActive()) {      // 光の粉の効果中は、どこから触れてもやっつける
      s.defeatedAt = frame;
      beep(520, 900, 0.12, 'square', 0.07);    // やっつけた
    } else {
      hurt();
      if (gameState === 'out') return;
    }
  }
}

// 虫に触れたか調べる。触れたらつかまえる（上からでも、横からでも、下からでも）
function checkBugs() {
  const pLeft = player.x - 4, pRight = player.x + player.w + 4;       // 少し大きめに見る（つかまえやすく）
  const pTop = player.y - PLAYER_HEAD, pBottom = player.y + player.h;
  for (const bug of bugs) {
    if (bug.caughtAt >= 0) continue;
    const screenX = bug.x - scrollX;
    const bLeft = screenX + BUG_HIT.dx, bRight = bLeft + BUG_HIT.w;
    const bBottom = GROUND_Y - bugHop(bug);
    const bTop = bBottom - BUG_HIT.h;
    if (pRight > bLeft && pLeft < bRight && pBottom > bTop && pTop < bBottom) {
      bug.caughtAt = frame;
      caught++;
      effects.push({ type: 'munch', x: bug.x + BUG_SIZE / 2, y: GROUND_Y - bugHop(bug) - 34, born: frame });   // 「ぱくっ！」
      beep(700, 1250, 0.16, 'triangle', 0.1);   // ピロッ
    }
  }
}

function draw() {
  ctx.setTransform(view.s, 0, 0, view.s, view.ox, view.oy);
  // 画面いっぱいに見える範囲（ゲームの座標で）。ゲームの外側の余白にも、空・地面・草を描く
  const left = -view.ox / view.s, right = (canvas.width - view.ox) / view.s;
  const top = -view.oy / view.s, bottom = (canvas.height - view.oy) / view.s;
  // 空と背景
  ctx.fillStyle = '#bfe8ff';
  ctx.fillRect(left, top, right - left, bottom - top);
  // 地面
  ctx.fillStyle = '#4caf50';
  ctx.fillRect(left, GROUND_Y, right - left, bottom - GROUND_Y);
  // 草（スクロールして見える）
  ctx.fillStyle = '#2e7d32';
  const gap = 40;
  for (let k = Math.floor((scrollX + left) / gap) - 1; k <= Math.ceil((scrollX + right) / gap) + 1; k++) {
    const x = k * gap - scrollX;
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y);
    ctx.lineTo(x + 10, GROUND_Y - 25);
    ctx.lineTo(x + 20, GROUND_Y);
    ctx.fill();
  }
  drawGoal(left, right);
  drawCrowShadow();
  drawBlocks(left, right);
  drawItems(left, right);
  drawBugs(left, right);
  drawSparrows(left, right);
  drawCats();
  drawCrow();
  drawEffects(left, right);
  drawAura();
  const blink = frame < player.invUntil && Math.floor(frame / 4) % 2 === 0;   // はじかれた後は、点滅する
  if (blink) ctx.globalAlpha = 0.35;
  drawMantis(player.x, player.y, frame, !player.onGround);
  ctx.globalAlpha = 1;
  drawHearts();
  if (gameState === 'out') drawOut();
  if (gameState === 'clear') drawClear();
}

// ハート（のこりのはじかれてよい回数）。左上に3つ。はじかれると、1つずつ、からになる
function drawHearts() {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const size = 32 * view.s, gap = 8 * view.s;
  const x0 = view.ox + 16 * view.s, y0 = view.oy + 14 * view.s;
  for (let i = 0; i < MAX_HP; i++) {
    const cx = x0 + i * (size + gap) + size / 2, cy = y0 + size / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy + size * 0.4);
    ctx.bezierCurveTo(cx - size * 0.8, cy - size * 0.05, cx - size * 0.48, cy - size * 0.65, cx, cy - size * 0.22);
    ctx.bezierCurveTo(cx + size * 0.48, cy - size * 0.65, cx + size * 0.8, cy - size * 0.05, cx, cy + size * 0.4);
    ctx.closePath();
    ctx.fillStyle = i < player.hp ? '#e53935' : 'rgba(255, 255, 255, 0.55)';
    ctx.fill();
    ctx.lineWidth = Math.max(2, size / 11);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = i < player.hp ? '#fff' : '#9e9e9e';
    ctx.stroke();
  }
  ctx.restore();
}

// ゴールの木を描く（絵の根もとを、地面にそろえる）
function drawGoal(left, right) {
  if (!goalImg.complete || goalImg.naturalWidth === 0) return;
  const sx = GOAL_X - scrollX;
  if (sx > right + TREE_SIZE || sx < left - TREE_SIZE) return;
  ctx.drawImage(goalImg, sx, GROUND_Y - TREE_SIZE * TREE_FOOT, TREE_SIZE, TREE_SIZE);
}

// スズメを描く（画面に見えるものだけ）。やっつけたものは、小さくなって消える
function drawSparrows(left, right) {
  if (!sparrowImg.complete || sparrowImg.naturalWidth === 0) return;
  for (const s of sparrows) {
    const screenX = s.x - scrollX;
    if (screenX > right + SPARROW_SIZE || screenX < left - SPARROW_SIZE) continue;
    let scale = 1;
    if (s.defeatedAt >= 0) {
      const t = (frame - s.defeatedAt) / POP_FRAMES;
      if (t >= 1) continue;
      scale = 1 - t;
    }
    const footY = GROUND_Y - sparrowHop(s);
    ctx.save();
    ctx.translate(screenX + SPARROW_SIZE / 2, footY);
    ctx.scale(scale, scale);
    ctx.drawImage(sparrowImg, -SPARROW_SIZE / 2, -SPARROW_SIZE * 0.88, SPARROW_SIZE, SPARROW_SIZE);
    ctx.restore();
  }
}

// ネコを描く。走っているときは、少し上下にゆれる。やっつけたものは、小さくなって消える
function drawCats() {
  if (!catImg.complete || catImg.naturalWidth === 0) return;
  for (const c of cats) {
    let sx, scale = 1;
    if (c.state === 'running') {
      sx = catScreenX(c);
    } else if (c.state === 'defeated' && frame - c.defeatedAt < POP_FRAMES) {
      sx = c.defeatX - SPEED * (frame - c.defeatedAt);   // 地面と一緒に、うしろへ流れる
      scale = 1 - (frame - c.defeatedAt) / POP_FRAMES;
    } else {
      continue;
    }
    const bob = c.state === 'running' ? Math.abs(Math.sin(frame * 0.4)) * -4 : 0;
    ctx.save();
    ctx.translate(sx + CAT_SIZE / 2, GROUND_Y + bob);
    ctx.scale(scale, scale);
    ctx.drawImage(catImg, -CAT_SIZE / 2, -CAT_SIZE * 0.88, CAT_SIZE, CAT_SIZE);
    ctx.restore();
  }
}

// カラスの影（予告）。だんだん大きくなって、カラスが降りてくる間は大きいまま、上へ戻るときに小さくなる
function drawCrowShadow() {
  const f = frame - crow.since;
  let q;   // 影の大きさの割合（0〜1）
  if (crow.state === 'warning') q = 0.6 * f / CROW_WARN_FRAMES;
  else if (crow.state === 'diving') q = 0.6 + 0.4 * f / CROW_DIVE_FRAMES;
  else if (crow.state === 'low') q = 1;
  else if (crow.state === 'rising') q = 1 - f / CROW_RISE_FRAMES;
  else return;
  const x = crow.shadowWorld - scrollX;
  const rx = 14 + 52 * q;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
  ctx.beginPath();
  ctx.ellipse(x, GROUND_Y + 12, rx, rx * 0.26, 0, 0, Math.PI * 2);
  ctx.fill();
}

// カラスを描く。やっつけたものは、小さくなって消える
function drawCrow() {
  if (!crowImg.complete || crowImg.naturalWidth === 0) return;
  if (crow.state === 'waiting') return;
  let x, y, faceLeft, scale = 1;
  if (crow.state === 'defeated') {
    const t = (frame - crow.defeatedAt) / POP_FRAMES;
    if (t >= 1) return;
    x = crow.defeatWorld - scrollX;
    y = crow.defeatY;
    faceLeft = true;
    scale = 1 - t;
  } else {
    const pose = crowPose();
    x = pose.x; y = pose.y; faceLeft = pose.faceLeft;
  }
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(faceLeft ? -scale : scale, scale);        // 絵は右向き。左へ向かうときは反転
  ctx.drawImage(crowImg, -CROW_SIZE / 2, -CROW_SIZE * 0.88, CROW_SIZE, CROW_SIZE);
  ctx.restore();
}

// 演出を描く。「ぱくっ！」は、きらきらと一緒に、ふわっと上がって消える。2段ジャンプは、足もとに輪が広がる
function drawEffects(left, right) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    const age = frame - e.born;
    const life = e.type === 'munch' ? MUNCH_FRAMES : e.type === 'ouch' ? OUCH_FRAMES : PUFF_FRAMES;
    if (age >= life) { effects.splice(i, 1); continue; }
    const t = age / life;                       // 0 → 1
    const sx = e.x - scrollX;
    if (sx < left - 120 || sx > right + 120) continue;
    ctx.save();
    if (e.type === 'munch') {
      ctx.globalAlpha = 1 - Math.max(0, (t - 0.6) / 0.4);
      // きらきら（まわりに広がる）
      ctx.fillStyle = '#FFEE58';
      ctx.strokeStyle = '#F9A825';
      ctx.lineWidth = 1.5;
      for (let k = 0; k < 8; k++) {
        const a = k * Math.PI / 4 + 0.3;
        const d = 18 + 38 * t;
        drawSparkle(sx + Math.cos(a) * d, e.y + 10 + Math.sin(a) * d * 0.8, k % 2 === 0 ? 8 : 5);
      }
      // 「ぱくっ！」の文字
      const size = 34 * (0.6 + 0.4 * Math.min(1, t * 5));
      ctx.font = 'bold ' + size + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#fff';
      ctx.fillStyle = '#ef6c00';
      const ty = e.y - 14 - 30 * t;
      ctx.strokeText('ぱくっ！', sx, ty);
      ctx.fillText('ぱくっ！', sx, ty);
    } else if (e.type === 'ouch') {
      // はじかれた：「いたっ！」が、ぷるぷるふるえながら、上がって消える
      ctx.globalAlpha = 1 - Math.max(0, (t - 0.55) / 0.45);
      ctx.font = 'bold 38px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#fff';
      ctx.fillStyle = '#e53935';
      const shake = Math.sin(age * 1.6) * 3 * (1 - t);
      ctx.strokeText('いたっ！', sx + shake, e.y - 24 * t);
      ctx.fillText('いたっ！', sx + shake, e.y - 24 * t);
    } else {
      // 2段ジャンプ：足もとに、白い輪がふわっと広がる
      ctx.globalAlpha = 0.8 * (1 - t);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 5 * (1 - t) + 1;
      ctx.beginPath();
      ctx.ellipse(sx, e.y, 14 + 34 * t, 5 + 9 * t, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ブロックを描く。たたいた直後は、ぽんと上にはねる。たたいたあとは茶色
function drawBlocks(left, right) {
  if (!blockImg.complete || blockImg.naturalWidth === 0) return;
  for (const b of blocks) {
    const sx = b.x - scrollX;
    if (sx > right + BLOCK_SIZE || sx < left - BLOCK_SIZE) continue;
    let bump = 0;
    if (b.hitAt >= 0 && frame - b.hitAt < 10) bump = -10 * Math.sin(Math.PI * (frame - b.hitAt) / 10);
    const img = b.used ? (getUsedBlockImage() || blockImg) : blockImg;
    ctx.drawImage(img, sx, GROUND_Y - BLOCK_BOTTOM - BLOCK_SIZE + bump, BLOCK_SIZE, BLOCK_SIZE);
  }
}

// アイテムを描く（ふわふわ上下にゆれる）
function drawItems(left, right) {
  for (const it of items) {
    const sx = it.x - scrollX;
    if (sx > right + ITEM_SIZE || sx < left - ITEM_SIZE) continue;
    const img = itemImgs[it.type];
    if (!img.complete || img.naturalWidth === 0) continue;
    const bob = it.vy === 0 ? Math.sin(frame * 0.12) * 3 : 0;
    ctx.drawImage(img, sx, it.y + bob, ITEM_SIZE, ITEM_SIZE);
  }
}

// 4つのとがった星（光の粉の、まわりのきらきら）
function drawSparkle(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x + r * 0.15, y - r * 0.15, x + r, y);
  ctx.quadraticCurveTo(x + r * 0.15, y + r * 0.15, x, y + r);
  ctx.quadraticCurveTo(x - r * 0.15, y + r * 0.15, x - r, y);
  ctx.quadraticCurveTo(x - r * 0.15, y - r * 0.15, x, y - r);
  ctx.closePath();
  ctx.fill();
}

// 効果中の、カマキリのまわり（光の粉：きらきらの輪、はねのはっぱ：緑の輪）
function drawAura() {
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2 - 6;
  if (leafActive()) {
    const r = 46 + 2 * Math.sin(frame * 0.15);
    const g = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r);
    g.addColorStop(0, 'rgba(129, 199, 132, 0)');
    g.addColorStop(1, 'rgba(102, 187, 106, 0.55)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(56, 142, 60, 0.8)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  if (lightActive()) {
    const r = 50 + 3 * Math.sin(frame * 0.2);
    const g = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r);
    g.addColorStop(0, 'rgba(255, 249, 196, 0.15)');
    g.addColorStop(1, 'rgba(255, 238, 88, 0.6)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFEE58';
    ctx.strokeStyle = '#F9A825';
    ctx.lineWidth = 1.5;
    for (let k = 0; k < 4; k++) {
      const a = frame * 0.07 + k * Math.PI / 2;
      drawSparkle(cx + Math.cos(a) * (r - 4), cy + Math.sin(a) * (r - 4), k % 2 === 0 ? 9 : 6);
    }
  }
}

// アウトの表示（画面を少し暗くして、「アウト！」と「もういちど」）
function drawOut() {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  // 「アウト！」
  const big = Math.round(84 * view.s);
  ctx.font = 'bold ' + big + 'px sans-serif';
  ctx.lineWidth = big / 7;
  ctx.strokeStyle = '#fff';
  ctx.fillStyle = '#e53935';
  ctx.strokeText('アウト！', cx, view.oy + H * 0.36 * view.s);
  ctx.fillText('アウト！', cx, view.oy + H * 0.36 * view.s);
  // 「もういちど」
  drawRetryButton(cx, view.oy + H * 0.62 * view.s);
  ctx.restore();
}

// 虫を描く（画面に見えるものだけ）。つかまえたものは、小さくなって消える
function drawBugs(left, right) {
  for (const bug of bugs) {
    const screenX = bug.x - scrollX;
    if (screenX > right + BUG_SIZE || screenX < left - BUG_SIZE) continue;
    const img = bugImgs[bug.type];
    if (!img.complete || img.naturalWidth === 0) continue;
    let scale = 1;
    if (bug.caughtAt >= 0) {
      const t = (frame - bug.caughtAt) / POP_FRAMES;
      if (t >= 1) continue;
      scale = 1 - t;
    }
    // 絵の足もとは、絵の高さの 88% のところ。そこを地面（跳ねているときは浮いた高さ）にそろえる
    const footY = GROUND_Y - bugHop(bug);
    ctx.save();
    ctx.translate(screenX + BUG_SIZE / 2, footY);
    ctx.scale(scale, scale);
    ctx.drawImage(img, -BUG_SIZE / 2, -BUG_SIZE * 0.88, BUG_SIZE, BUG_SIZE);
    ctx.restore();
  }
}

// 「もういちど」ボタン（アウト・ゴールの画面で使う。止まった直後は出さない）
function drawRetryButton(cx, by) {
  if (outFrames <= RETRY_WAIT) return;
  const bw = 260 * view.s, bh = 70 * view.s;
  ctx.fillStyle = '#fff';
  const r = bh / 2, x0 = cx - bw / 2, y0 = by - bh / 2;   // 両はしが丸いボタン
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0);
  ctx.lineTo(x0 + bw - r, y0);
  ctx.arc(x0 + bw - r, y0 + r, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(x0 + r, y0 + bh);
  ctx.arc(x0 + r, y0 + r, r, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
  ctx.fill();
  ctx.font = 'bold ' + Math.round(38 * view.s) + 'px sans-serif';
  ctx.fillStyle = '#2e7d32';
  ctx.fillText('もういちど', cx, by);
}

// ゴールの結果画面：「ぜんぶで ○ひき！」（○は、つかまえた虫の数）
function drawClear() {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  const line = (text, size, y, fill, stroke) => {
    ctx.font = 'bold ' + Math.round(size * view.s) + 'px sans-serif';
    ctx.lineWidth = size * view.s / 7;
    ctx.strokeStyle = stroke;
    ctx.fillStyle = fill;
    ctx.strokeText(text, cx, view.oy + y * view.s);
    ctx.fillText(text, cx, view.oy + y * view.s);
  };
  line('ぜんぶで', 44, H * 0.2, '#fff', '#2e7d32');
  line(caught + ' ひき！', 110, H * 0.42, '#ffeb3b', '#e65100');
  drawRetryButton(cx, view.oy + H * 0.7 * view.s);
  ctx.restore();
}

// 画像を読みこむ
const mantisImg = new Image();
mantisImg.src = 'images/mantis.png';

// カマキリ（右向き）。px, py は当たり判定の左上。t は動きの時間、air はジャンプ中
// 絵は左向きなので、左右を反転して描く。足もとを当たり判定の下にそろえる
function drawMantis(px, py, t, air) {
  if (!mantisImg.complete || mantisImg.naturalWidth === 0) return;
  const dw = 64;
  const dh = dw * mantisImg.naturalHeight / mantisImg.naturalWidth;
  const bob = air ? 0 : Math.abs(Math.sin(t * 0.15)) * -3;   // 走るときの上下ゆれ
  ctx.save();
  ctx.translate(px + player.w / 2, py + player.h + bob);
  ctx.scale(-1, 1);
  ctx.drawImage(mantisImg, -dw / 2, -dh, dw, dh);
  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
